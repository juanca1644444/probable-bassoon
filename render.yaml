services:
  - type: web
    name: chaskyapp-backend
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TIMEOUT_MINUTES
        value: "15"
      - key: GEMINI_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: DB_PATH
        value: ./whatsapp_pro.db
      - key: BACKUP_ENCRYPTION_KEY
        value: JYXCCNYtVHBh3-2RdD5gdgnz2FPx0WS9E4Yx6KP4l-E=
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false

